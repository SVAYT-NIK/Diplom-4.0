version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: heat-backend
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/heat_analytics.db
      - NORM_HDD=4500
      - ANOMALY_THRESHOLD=3.0
      - CLUSTER_K=4
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: heat-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
